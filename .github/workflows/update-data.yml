name: Update publications & Scholar metrics

# Runs every Monday at 06:00 UTC. Also runnable on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write    # so the job can commit updated JSON back to the repo

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch publications from ORCID
        env:
          ORCID_ID: ${{ secrets.ORCID_ID }}
        run: python scripts/fetch_orcid.py

      - name: Fetch Scholar metrics
        env:
          SCHOLAR_USER: ${{ secrets.SCHOLAR_USER }}
        run: python scripts/fetch_scholar.py

      - name: Commit any changes
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/*.json
            git commit -m "chore(data): refresh publications & Scholar metrics"
            git push
          else
            echo "No changes."
          fi
